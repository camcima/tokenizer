# Git hooks, managed by lefthook (installed into .tools/bin by `make tools`).
# Opt-in per clone: `make hooks` installs them into .git/hooks. CI runs the same checks (gofmt in
# `make lint`, gitleaks and the comment rule in `make ci`, commit messages in the CI workflow's
# commits job via `make commit-check`), so skipping a hook locally does not skip the check.

pre-commit:
  parallel: true
  jobs:
    # The staged content of each Go file, not the working copy, must already be gofmt-formatted.
    - name: gofmt
      glob: "*.go"
      run: |
        gofmt="$(go env GOROOT)/bin/gofmt"
        bad=""
        for f in {staged_files}; do
          out=$(git show ":$f" | "$gofmt" -l) || { echo "gofmt: cannot format $f"; exit 1; }
          [ -z "$out" ] || bad="$bad $f"
        done
        if [ -n "$bad" ]; then
          echo "gofmt: staged files are not formatted:$bad"
          echo "fix with: gofmt -w$bad && git add$bad"
          exit 1
        fi

    # Secrets in the staged changes, with the same rules and allowlist as `make gitleaks`.
    - name: gitleaks
      run: |
        gl=.tools/bin/gitleaks
        [ -x "$gl" ] || { echo "gitleaks: $gl missing, run: make tools"; exit 1; }
        "$gl" git --pre-commit --staged --redact --no-banner --verbose --config .gitleaks.toml .

    # Code comments explain behaviour and reasons; they never point at the spec, the plan or the
    # design documents (CLAUDE.md). The rule lives in scripts/check-comments.sh, shared with
    # `make comment-check`; vendor/ is third-party code.
    - name: comment-rule
      glob: "*.go"
      exclude:
        - "vendor/**"
      run: scripts/check-comments.sh --staged {staged_files}

commit-msg:
  jobs:
    # Conventional commits; the rule lives in scripts/check-commit-msg.sh, shared with
    # `make commit-check`.
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}

pre-push:
  jobs:
    - name: ci
      run: make ci
