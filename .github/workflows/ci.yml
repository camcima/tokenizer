name: CI

# make ci: gofmt, go vet, staticcheck, govulncheck, the dependency and vendor checks, docs-check,
# the comment rule, gitleaks over the full history, unit tests with the race detector, and the
# build. The commits job applies the commit-msg hook's rule to every commit the event brings, so
# each check a git hook enforces locally also fails CI, and on pull requests to the title as well:
# main takes squash merges, whose commit message is the pull request's title.
on:
  push:
    branches: [main]
  # edited: a corrected title is checked again without a new push (a re-run would reuse the old
  # title from the original event).
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# A newer run cancels an older one only on pull requests. Pushes to main each keep their run, so
# every pushed commit range gets its commit-message check: each push run gets its own group,
# because a shared group would still drop a queued run when a newer one arrives.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the checked-out tree
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make ci
        run: make ci

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests: the branch's own commits (base..head, not the synthetic merge commit
      # GitHub checks out). Pushes to main: the pushed range, or only the pushed commit when the
      # push has no previous commit (a new branch).
      - name: make commit-check
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_SHA^!"
          else
            range="$BEFORE_SHA..$PUSH_SHA"
          fi
          make commit-check COMMIT_RANGE="$range"

      # The squash merge's commit subject is the title plus GitHub's " (#N)" suffix, so that whole
      # subject must pass the same rule (a title that fits 72 characters alone can overflow with
      # the suffix). The title goes through env, never into the script text, and --message keeps
      # it from being read as a file name. It also runs when commit-check failed, so both failures
      # show at once.
      - name: pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/check-commit-msg.sh --message "$PR_TITLE (#$PR_NUMBER)"
